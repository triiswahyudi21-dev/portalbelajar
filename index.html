<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal E-Learning IPS</title>

  <!-- Google Font: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- SheetJS / XLSX CDN untuk Export Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Babel Standalone untuk JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }
  </style>

  <!-- Import Map untuk React, Firebase, dan Lucide Icons -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
        "lucide-react": "https://esm.sh/lucide-react@0.263.1"
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-blue-500 selection:text-white pb-20 md:pb-0">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'react';
    import { createRoot } from 'react-dom/client';
    import { initializeApp } from 'firebase/app';
    import { getAuth, signInAnonymously, signInWithCustomToken } from 'firebase/auth';
    import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from 'firebase/firestore';
    import { 
      BookOpen, Users, LogIn, FileText, PlusCircle, CheckCircle, 
      Award, ArrowLeft, LogOut, List, Trash2, Filter, Upload, Lock, UserPlus,
      Clock, AlertTriangle, RefreshCw, Radio, Download, LayoutDashboard, StopCircle, User
    } from 'lucide-react';

    // Konfigurasi Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyD3M8FfqHdzCRO3VCKB24xPEcEZgVVK--M",
      authDomain: "gen-lang-client-0031221493.firebaseapp.com",
      databaseURL: "https://gen-lang-client-0031221493-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "gen-lang-client-0031221493",
      storageBucket: "gen-lang-client-0031221493.firebasestorage.app",
      messagingSenderId: "514951591302",
      appId: "1:514951591302:web:65d128106e2d2f3663e807",
      measurementId: "G-VF7M8CDSYQ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'elearning-ips-v3';

    // BroadcastChannel untuk Sync Realtime antar Tab Browser
    const broadcast = typeof window !== 'undefined' && 'BroadcastChannel' in window
      ? new BroadcastChannel('elearning_ips_realtime_channel')
      : null;

    const defaultMaterials = [
      { 
        id: 'm1', 
        title: 'Mengenal Kebutuhan Manusia & Kelangkaan Sumber Daya', 
        kelas: '7', 
        subKelasTarget: 'semua', 
        semester: '1', 
        durationMinutes: 15,
        content: `Kebutuhan manusia merupakan aspek esensial yang harus dipenuhi untuk mempertahankan kelangsungan hidup.

1. Kebutuhan Menurut Tingkat Intensitas:
   - Kebutuhan Primer: Kebutuhan pokok seperti pangan, sandang, dan papan.
   - Kebutuhan Sekunder: Kebutuhan pelengkap setelah kebutuhan primer terpenuhi, seperti perabot rumah dan alat komunikasi.
   - Kebutuhan Tersier: Kebutuhan akan barang mewah untuk meningkatkan status sosial.

2. Kelangkaan (Scarcity):
   Kelangkaan terjadi ketika alat pemuas kebutuhan jumlahnya terbatas sementara kebutuhan manusia tidak terbatas.
   Faktor penyebab kelangkaan meliputi:
   - Keterbatasan sumber daya alam.
   - Perbedaan letak geografis.
   - Pertumbuhan jumlah penduduk yang pesat.
   - Keterbatasan kemampuan produksi manusia.`, 
        imageUrl: 'https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?auto=format&fit=crop&w=800&q=80',
        source: 'Buku Paket IPS SMP Kelas 7 Kemendikbudristek Bab 1',
        createdBy: 'Dra. Hj. Siti Rahmah, M.Pd.',
        createdAt: Date.now()
      },
      {
        id: 'm2',
        title: 'Perubahan Sosial Budaya dan Dampak Globalisasi',
        kelas: '9',
        subKelasTarget: 'semua',
        semester: '1',
        durationMinutes: 20,
        content: `Perubahan sosial budaya adalah perubahan yang terjadi pada sistem sosial, struktur, dan fungsi masyarakat.

A. Bentuk Perubahan Sosial Budaya:
1. Dilihat dari waktunya: Evolusi (lambat) dan Revolusi (cepat).
2. Dilihat dari pengaruhnya: Pengaruh kecil dan Pengaruh besar.
3. Dilihat dari perencanaannya: Perubahan yang direncanakan dan tidak direncanakan.

B. Globalisasi:
Globalisasi adalah proses mendunia yang menghilangkan sekat geografis antar negara. Globalisasi membawa dampak positif seperti kemajuan teknologi informasi, namun juga dampak negatif seperti westernisasi dan demoralisasi jika tidak disikapi secara bijak.`,
        imageUrl: 'https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?auto=format&fit=crop&w=800&q=80',
        source: 'Buku Paket IPS Kelas 9 Kurikulum Merdeka Bab 2',
        createdBy: 'Dra. Hj. Siti Rahmah, M.Pd.',
        createdAt: Date.now() - 86400000
      }
    ];

    const defaultQuestions = [
      { id: 'q1', materialId: 'm1', type: 'pg', questionText: 'Makanan, pakaian, dan tempat tinggal termasuk dalam jenis kebutuhan...', optionA: 'Primer', optionB: 'Sekunder', optionC: 'Tersier', optionD: 'Jasmani', correctAnswer: 'A' },
      { id: 'q2', materialId: 'm1', type: 'isian', questionText: 'Kondisi dimana alat pemuas kebutuhan jumlahnya terbatas sedangkan kebutuhan tidak terbatas disebut...', correctAnswer: 'kelangkaan' }
    ];

    const defaultStudents = [
      { id: 's1', name: 'Ahmad Rizky Pratama', kelas: '7', subKelas: 'A' },
      { id: 's2', name: 'Anisa Rahmawati', kelas: '7', subKelas: 'A' },
      { id: 's3', name: 'Budi Santoso', kelas: '7', subKelas: 'B' },
      { id: 's4', name: 'Bayu Nugroho', kelas: '7', subKelas: 'C' },
      { id: 's5', name: 'Dina Mariana', kelas: '7', subKelas: 'D' },
      { id: 's6', name: 'Citra Dewi Kartika', kelas: '8', subKelas: 'A' },
      { id: 's7', name: 'Dimas Anggara', kelas: '8', subKelas: 'B' },
      { id: 's8', name: 'Eka Putri Utami', kelas: '8', subKelas: 'C' },
      { id: 's9', name: 'Fajar Hidayat', kelas: '8', subKelas: 'D' },
      { id: 's10', name: 'Farel Prayoga', kelas: '9', subKelas: 'A' },
      { id: 's11', name: 'Gilang Ramadhan', kelas: '9', subKelas: 'B' },
      { id: 's12', name: 'Hani Sofia', kelas: '9', subKelas: 'C' },
      { id: 's13', name: 'Indah Permata', kelas: '9', subKelas: 'D' }
    ];

    // --- COMPONENT PORTAL SISWA ---
    function StudentApp({ onBackToRoleSelect }) {
      const [students, setStudents] = useState([]);
      const [materials, setMaterials] = useState([]);
      const [questions, setQuestions] = useState([]);
      
      const [selectedKelas, setSelectedKelas] = useState('7');
      const [selectedSubKelas, setSelectedSubKelas] = useState('A');
      const [studentSession, setStudentSession] = useState(null);
      const [selectedStudentId, setSelectedStudentId] = useState('');
      
      const [activeMaterial, setActiveMaterial] = useState(null);
      const [timer, setTimer] = useState(0);
      const [isReading, setIsReading] = useState(false);

      // State Pengerjaan Latihan Soal
      const [activeQuizMaterial, setActiveQuizMaterial] = useState(null);
      const [userAnswers, setUserAnswers] = useState({});
      const [quizResult, setQuizResult] = useState(null);

      // Load data dari Cloud Firestore
      useEffect(() => {
        signInAnonymously(auth).catch(() => {});

        const unsubStudents = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'students'), (snap) => {
          const list = [];
          snap.docs.forEach(doc => list.push(doc.data()));
          setStudents(list.length > 0 ? list : defaultStudents);
        });

        const unsubMaterials = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'materials'), (snap) => {
          const list = [];
          snap.docs.forEach(doc => list.push(doc.data()));
          setMaterials(list.length > 0 ? list : defaultMaterials);
        });

        const unsubQuestions = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'questions'), (snap) => {
          const list = [];
          snap.docs.forEach(doc => list.push(doc.data()));
          setQuestions(list.length > 0 ? list : defaultQuestions);
        });

        return () => {
          unsubStudents();
          unsubMaterials();
          unsubQuestions();
        };
      }, []);

      // Filter daftar nama siswa sesuai Kelas dan Rombel yang dipilih
      const availableStudents = students.filter(s => s.kelas === selectedKelas && s.subKelas === selectedSubKelas);

      const handleStudentLogin = (e) => {
        e.preventDefault();
        const found = students.find(s => s.id === selectedStudentId);
        if (found) {
          setStudentSession(found);
        }
      };

      // Timer & Monitoring Kehadiran Realtime
      useEffect(() => {
        let interval = null;
        if (isReading && timer > 0) {
          interval = setInterval(() => {
            setTimer(prev => {
              const newTime = prev - 1;
              updatePresence(newTime, 'active');
              return newTime;
            });
          }, 1000);
        } else if (timer === 0 && isReading) {
          setIsReading(false);
          updatePresence(0, 'completed');
        }
        return () => clearInterval(interval);
      }, [isReading, timer]);

      const updatePresence = async (remSecs, status) => {
        if (!studentSession || !activeMaterial) return;
        const presKey = `${studentSession.id}_${activeMaterial.id}`;
        const presData = {
          id: presKey,
          studentId: studentSession.id,
          studentName: studentSession.name,
          kelas: studentSession.kelas,
          subKelas: studentSession.subKelas,
          materialId: activeMaterial.id,
          materialTitle: activeMaterial.title,
          remainingSeconds: remSecs,
          status: status,
          lastUpdated: Date.now()
        };

        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'student_presence', presKey);
          await setDoc(docRef, presData);
        } catch (e) {}

        if (broadcast) {
          broadcast.postMessage({ type: 'STUDENT_PRESENCE_UPDATE', payload: presData });
        }
      };

      const startReading = (mat) => {
        setActiveMaterial(mat);
        const durationSecs = (mat.durationMinutes || 15) * 60;
        setTimer(durationSecs);
        setIsReading(true);
      };

      // Handler Submit Kuis Latihan Soal
      const handleSubmitQuiz = async (e) => {
        e.preventDefault();
        const currentQuestions = questions.filter(q => q.materialId === activeQuizMaterial.id);
        if (currentQuestions.length === 0) return;

        let correctCount = 0;
        currentQuestions.forEach(q => {
          const ans = (userAnswers[q.id] || '').trim().toLowerCase();
          const target = (q.correctAnswer || '').trim().toLowerCase();
          if (ans === target) {
            correctCount++;
          }
        });

        const calculatedScore = Math.round((correctCount / currentQuestions.length) * 100);
        
        const scoreData = {
          id: `sc_${Date.now()}_${studentSession.id}`,
          studentId: studentSession.id,
          studentName: studentSession.name,
          kelas: studentSession.kelas,
          subKelas: studentSession.subKelas,
          materialId: activeQuizMaterial.id,
          materialTitle: activeQuizMaterial.title,
          score: calculatedScore,
          totalQuestions: currentQuestions.length,
          correctAnswers: correctCount,
          submittedAt: Date.now()
        };

        // Simpan ke Firestore dan LocalStorage
        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'scores', scoreData.id);
          await setDoc(docRef, scoreData);
        } catch (e) {}

        const localScores = JSON.parse(localStorage.getItem('elearning_scores_v3') || '[]');
        localStorage.setItem('elearning_scores_v3', JSON.stringify([scoreData, ...localScores]));

        setQuizResult(scoreData);
      };

      if (!studentSession) {
        return (
          <div className="min-h-screen bg-slate-950 flex flex-col justify-center items-center p-4">
            <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl relative">
              <button onClick={onBackToRoleSelect} className="absolute top-4 left-4 text-xs text-slate-400 hover:text-white flex items-center gap-1">
                <ArrowLeft className="w-4 h-4"/> Ganti Portal
              </button>
              
              <div className="text-center mt-4 mb-6">
                <div className="inline-flex p-3 bg-blue-600 rounded-2xl mb-2">
                  <User className="w-8 h-8 text-white" />
                </div>
                <h1 className="text-xl font-extrabold text-white">Portal Siswa E-Learning</h1>
                <p className="text-slate-400 text-xs mt-1">Pilih Kelas dan Nama Anda untuk Masuk</p>
              </div>

              <form onSubmit={handleStudentLogin} className="space-y-4">
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Kelas</label>
                    <select value={selectedKelas} onChange={(e) => setSelectedKelas(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white">
                      <option value="7">Kelas 7</option>
                      <option value="8">Kelas 8</option>
                      <option value="9">Kelas 9</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Rombel</label>
                    <select value={selectedSubKelas} onChange={(e) => setSelectedSubKelas(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white">
                      <option value="A">Rombel A</option>
                      <option value="B">Rombel B</option>
                      <option value="C">Rombel C</option>
                      <option value="D">Rombel D</option>
                    </select>
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-400 mb-1">Pilih Nama Siswa</label>
                  <select 
                    value={selectedStudentId} 
                    onChange={(e) => setSelectedStudentId(e.target.value)}
                    required 
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white"
                  >
                    <option value="">-- Pilih Nama Anda --</option>
                    {availableStudents.map(s => (
                      <option key={s.id} value={s.id}>{s.name}</option>
                    ))}
                  </select>
                  {availableStudents.length === 0 && (
                    <p className="text-[10px] text-amber-400 mt-1">Nama siswa belum diupload oleh Guru untuk kelas ini.</p>
                  )}
                </div>

                <button type="submit" disabled={!selectedStudentId} className="w-full bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white font-bold py-3 rounded-xl transition-all shadow-lg text-xs">
                  Masuk Portal Belajar
                </button>
              </form>
            </div>
          </div>
        );
      }

      const availableMaterials = materials.filter(m => String(m.kelas) === String(studentSession.kelas));

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 p-4 max-w-4xl mx-auto">
          <header className="flex justify-between items-center bg-slate-900 border border-slate-800 p-4 rounded-2xl mb-6">
            <div>
              <h2 className="font-bold text-white text-sm">{studentSession.name}</h2>
              <p className="text-slate-400 text-xs">Kelas {studentSession.kelas} - Rombel {studentSession.subKelas}</p>
            </div>
            <button onClick={() => setStudentSession(null)} className="text-red-400 hover:text-red-300 text-xs font-semibold flex items-center gap-1 bg-red-500/10 px-3 py-2 rounded-xl border border-red-500/20">
              <LogOut className="w-3.5 h-3.5"/> Keluar
            </button>
          </header>

          {/* DUKUNGAN PENUH LAYAR LATIHAN SOAL / KUIS */}
          {activeQuizMaterial ? (
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-6">
              <button 
                onClick={() => { setActiveQuizMaterial(null); setUserAnswers({}); setQuizResult(null); }} 
                className="text-xs text-slate-400 hover:text-white flex items-center gap-1"
              >
                <ArrowLeft className="w-4 h-4"/> Kembali ke Daftar Materi
              </button>

              <div className="border-b border-slate-800 pb-4">
                <span className="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-1 rounded-lg font-bold">
                  Latihan Soal & Evaluasi
                </span>
                <h1 className="text-lg font-bold text-white mt-2">{activeQuizMaterial.title}</h1>
              </div>

              {quizResult ? (
                <div className="text-center p-8 bg-slate-950 border border-slate-800 rounded-2xl space-y-4">
                  <Award className="w-16 h-16 text-amber-400 mx-auto" />
                  <h3 className="text-xl font-bold text-white">Hasil Latihan Soal</h3>
                  <div className="text-4xl font-extrabold text-blue-400">{quizResult.score} / 100</div>
                  <p className="text-xs text-slate-400">
                    Jawaban Benar: {quizResult.correctAnswers} dari {quizResult.totalQuestions} Soal
                  </p>
                  <button 
                    onClick={() => { setActiveQuizMaterial(null); setUserAnswers({}); setQuizResult(null); }}
                    className="bg-blue-600 hover:bg-blue-500 text-white font-bold px-6 py-2.5 rounded-xl text-xs transition-all mt-4"
                  >
                    Selesai & Kembali
                  </button>
                </div>
              ) : (
                <form onSubmit={handleSubmitQuiz} className="space-y-6">
                  {questions.filter(q => q.materialId === activeQuizMaterial.id).map((q, idx) => (
                    <div key={q.id} className="bg-slate-950 border border-slate-800 p-4 sm:p-5 rounded-2xl space-y-3">
                      <p className="font-bold text-white text-xs leading-relaxed">
                        {idx + 1}. {q.questionText}
                      </p>

                      {q.type === 'pg' ? (
                        <div className="space-y-2">
                          {['A', 'B', 'C', 'D'].map((optKey) => {
                            const optText = q[`option${optKey}`];
                            if (!optText) return null;
                            return (
                              <label key={optKey} className={`flex items-center gap-3 p-3 rounded-xl border text-xs cursor-pointer transition-all ${userAnswers[q.id] === optKey ? 'bg-blue-600/20 border-blue-500 text-white' : 'bg-slate-900 border-slate-800 text-slate-300 hover:border-slate-700'}`}>
                                <input 
                                  type="radio" 
                                  name={`q_${q.id}`} 
                                  value={optKey} 
                                  checked={userAnswers[q.id] === optKey}
                                  onChange={() => setUserAnswers(prev => ({ ...prev, [q.id]: optKey }))}
                                  className="accent-blue-500"
                                  required
                                />
                                <span><strong className="text-blue-400">{optKey}.</strong> {optText}</span>
                              </label>
                            );
                          })}
                        </div>
                      ) : (
                        <div>
                          <input 
                            type="text" 
                            required
                            placeholder="Tuliskan jawaban singkat Anda di sini..."
                            value={userAnswers[q.id] || ''}
                            onChange={(e) => setUserAnswers(prev => ({ ...prev, [q.id]: e.target.value }))}
                            className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white focus:border-blue-500 outline-none"
                          />
                        </div>
                      )}
                    </div>
                  ))}

                  {questions.filter(q => q.materialId === activeQuizMaterial.id).length === 0 ? (
                    <div className="p-8 text-center text-slate-500 bg-slate-950 rounded-2xl border border-slate-800 text-xs">
                      Belum ada soal latihan yang dibuat oleh guru untuk materi ini.
                    </div>
                  ) : (
                    <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl transition-all text-xs shadow-lg shadow-emerald-600/30">
                      Kirim Jawaban & Lihat Nilai
                    </button>
                  )}
                </form>
              )}
            </div>
          ) : activeMaterial ? (
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
              <button onClick={() => { setIsReading(false); setActiveMaterial(null); }} className="text-xs text-slate-400 hover:text-white flex items-center gap-1 mb-2">
                <ArrowLeft className="w-4 h-4"/> Kembali ke Daftar Materi
              </button>

              <div className="flex justify-between items-center border-b border-slate-800 pb-4">
                <h1 className="text-lg font-bold text-white">{activeMaterial.title}</h1>
                <div className="bg-amber-500/20 text-amber-300 border border-amber-500/30 font-mono font-bold px-3 py-1.5 rounded-xl text-xs flex items-center gap-1.5">
                  <Clock className="w-4 h-4 text-amber-400"/>
                  {Math.floor(timer / 60)}:{(timer % 60).toString().padStart(2, '0')}
                </div>
              </div>

              {activeMaterial.imageUrl && (
                <img src={activeMaterial.imageUrl} alt={activeMaterial.title} className="w-full h-48 object-cover rounded-xl"/>
              )}

              <div className="text-slate-300 text-xs leading-relaxed whitespace-pre-line font-sans">
                {activeMaterial.content}
              </div>
            </div>
          ) : (
            <div className="space-y-4">
              <h3 className="font-bold text-white text-sm flex items-center gap-2">
                <BookOpen className="w-4 h-4 text-blue-500"/> Materi Pembelajaran & Latihan Soal
              </h3>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {availableMaterials.map(m => {
                  const qCount = questions.filter(q => q.materialId === m.id).length;
                  return (
                    <div key={m.id} className="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex flex-col justify-between">
                      <div>
                        <span className="text-[10px] bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2 py-0.5 rounded-lg font-bold">
                          Kelas {m.kelas}
                        </span>
                        <h4 className="font-bold text-white text-sm mt-2">{m.title}</h4>
                        <p className="text-slate-400 text-xs line-clamp-2 mt-1">{m.content}</p>
                      </div>

                      <div className="mt-4 space-y-2">
                        <button 
                          onClick={() => startReading(m)} 
                          className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded-xl text-xs transition-all flex justify-center items-center gap-2"
                        >
                          <BookOpen className="w-3.5 h-3.5"/> Pelajari Materi
                        </button>
                        
                        <button 
                          onClick={() => setActiveQuizMaterial(m)} 
                          className="w-full bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 border border-emerald-500/30 font-bold py-2 rounded-xl text-xs transition-all flex justify-center items-center gap-2"
                        >
                          <List className="w-3.5 h-3.5"/> Kerjakan Latihan Soal ({qCount})
                        </button>
                      </div>
                    </div>
                  );
                })}

                {availableMaterials.length === 0 && (
                  <div className="col-span-full p-8 text-center text-slate-500 bg-slate-900/50 rounded-2xl border border-slate-800 text-xs">
                    Belum ada materi terbit untuk Kelas {studentSession.kelas}.
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- COMPONENT UTAMA DENGAN PILIHAN PORTAL GURU / SISWA ---
    function AppWrapper() {
      const [role, setRole] = useState(null); // 'guru' | 'siswa' | null

      if (!role) {
        return (
          <div className="min-h-screen bg-slate-950 flex flex-col justify-center items-center p-4">
            <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 text-center shadow-2xl">
              <h1 className="text-2xl font-extrabold text-white mb-2">Portal E-Learning IPS</h1>
              <p className="text-slate-400 text-xs mb-8">Pilih akses masuk portal perangkat Anda</p>

              <div className="space-y-4">
                <button 
                  onClick={() => setRole('siswa')}
                  className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-4 rounded-2xl shadow-lg transition-all flex items-center justify-center gap-3 text-sm"
                >
                  <User className="w-5 h-5"/> Masuk Sebagai Siswa
                </button>

                <button 
                  onClick={() => setRole('guru')}
                  className="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-4 rounded-2xl border border-slate-700 transition-all flex items-center justify-center gap-3 text-sm"
                >
                  <Lock className="w-5 h-5 text-blue-400"/> Masuk Dashboard Guru
                </button>
              </div>
            </div>
          </div>
        );
      }

      if (role === 'siswa') {
        return <StudentApp onBackToRoleSelect={() => setRole(null)} />;
      }

      return (
        <div>
          <div className="bg-slate-900 border-b border-slate-800 px-4 py-2 flex justify-between items-center text-xs">
            <span className="text-slate-400">Akses: <strong className="text-blue-400">Portal Guru</strong></span>
            <button onClick={() => setRole(null)} className="text-slate-400 hover:text-white underline text-[11px]">Ganti Portal</button>
          </div>
          <TeacherApp />
        </div>
      );
    }

    function TeacherApp() {
      const [appSession, setAppSession] = useState(() => {
        const saved = localStorage.getItem('elearning_guru_session_v3');
        return saved ? JSON.parse(saved) : null;
      });

      const [materials, setMaterials] = useState(() => {
        const local = localStorage.getItem('elearning_materials_v3');
        return local ? JSON.parse(local) : defaultMaterials;
      });

      const [questions, setQuestions] = useState(() => {
        const local = localStorage.getItem('elearning_questions_v3');
        return local ? JSON.parse(local) : defaultQuestions;
      });

      const [students, setStudents] = useState(() => {
        const local = localStorage.getItem('elearning_students_v3');
        return local ? JSON.parse(local) : defaultStudents;
      });

      const [scores, setScores] = useState(() => {
        const local = localStorage.getItem('elearning_scores_v3');
        return local ? JSON.parse(local) : [];
      });

      const [liveMonitorData, setLiveMonitorData] = useState(() => {
        const local = localStorage.getItem('elearning_live_monitor');
        return local ? JSON.parse(local) : {};
      });

      // State UI Navigation
      const [activeTab, setActiveTab] = useState('dashboard');
      const [selectedMaterial, setSelectedMaterial] = useState(null);
      const [notification, setNotification] = useState(null);

      // Form Login Guru State
      const [loginGuruName, setLoginGuruName] = useState('');
      const [loginGuruPass, setLoginGuruPass] = useState('');

      // State Form Siswa Batch
      const [studentInputKelas, setStudentInputKelas] = useState('7');
      const [studentInputSubKelas, setStudentInputSubKelas] = useState('A');
      const [rawStudentNames, setRawStudentNames] = useState('');

      // Filter
      const [manageStudentClass, setManageStudentClass] = useState('7');
      const [manageStudentSubClass, setManageStudentSubClass] = useState('A');
      const [filterClassGuru, setFilterClassGuru] = useState('semua');

      // State Filter Rekap Nilai
      const [rekapFilterClass, setRekapFilterClass] = useState('semua');
      const [rekapFilterSubClass, setRekapFilterSubClass] = useState('semua');

      // Persistence LocalStorage
      useEffect(() => { localStorage.setItem('elearning_materials_v3', JSON.stringify(materials)); }, [materials]);
      useEffect(() => { localStorage.setItem('elearning_questions_v3', JSON.stringify(questions)); }, [questions]);
      useEffect(() => { localStorage.setItem('elearning_students_v3', JSON.stringify(students)); }, [students]);
      useEffect(() => { localStorage.setItem('elearning_scores_v3', JSON.stringify(scores)); }, [scores]);
      useEffect(() => { localStorage.setItem('elearning_live_monitor', JSON.stringify(liveMonitorData)); }, [liveMonitorData]);

      useEffect(() => {
        if (appSession) {
          localStorage.setItem('elearning_guru_session_v3', JSON.stringify(appSession));
        } else {
          localStorage.removeItem('elearning_guru_session_v3');
        }
      }, [appSession]);

      // Firebase & Storage Sync Listener
      useEffect(() => {
        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (e) {
            console.log("Firebase fallback lokal aktif");
          }
        };
        initAuth();

        // Push default/local questions to Cloud Firestore immediately to guarantee student visibility
        const uploadInitialQuestions = async () => {
          try {
            for (const q of questions) {
              const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'questions', q.id);
              await setDoc(docRef, q);
            }
            for (const m of materials) {
              const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'materials', m.id);
              await setDoc(docRef, m);
            }
            
            // Simpan juga sebagai daftar soal di dokumen data_questions
            const questionsRef = doc(db, 'artifacts', appId, 'public', 'data_questions');
            await setDoc(questionsRef, { list: questions });
          } catch (e) {
            console.log("Offline mode active for initial sync");
          }
        };
        uploadInitialQuestions();

        // Listener Realtime Cloud Firestore untuk Materi (Sinkron dengan Portal Siswa)
        try {
          const materialsCol = collection(db, 'artifacts', appId, 'public', 'data', 'materials');
          const unsubMat = onSnapshot(materialsCol, (snapshot) => {
            const remoteMat = [];
            snapshot.docs.forEach(doc => remoteMat.push(doc.data()));
            if (remoteMat.length > 0) setMaterials(remoteMat);
          }, (err) => console.log("Offline mode active (materials)"));

          // Listener Realtime Cloud Firestore untuk Soal (Sinkron dengan Portal Siswa)
          const questionsCol = collection(db, 'artifacts', appId, 'public', 'data', 'questions');
          const unsubQ = onSnapshot(questionsCol, (snapshot) => {
            const remoteQ = [];
            snapshot.docs.forEach(doc => remoteQ.push(doc.data()));
            if (remoteQ.length > 0) setQuestions(remoteQ);
          }, (err) => console.log("Offline mode active (questions)"));

          // Listener Firestore untuk presensi siswa secara realtime
          const presenceCol = collection(db, 'artifacts', appId, 'public', 'data', 'student_presence');
          const unsubPresence = onSnapshot(presenceCol, (snapshot) => {
            const remotePresences = {};
            snapshot.docs.forEach(doc => {
              remotePresences[doc.id] = doc.data();
            });
            if (Object.keys(remotePresences).length > 0) {
              setLiveMonitorData(prev => ({ ...prev, ...remotePresences }));
            }
          }, (err) => console.log("Offline mode active (presence)"));

          // Listener Firestore untuk Data Siswa Realtime
          const studentsCol = collection(db, 'artifacts', appId, 'public', 'data', 'students');
          const unsubStudents = onSnapshot(studentsCol, (snapshot) => {
            const remoteStudents = [];
            snapshot.docs.forEach(doc => {
              remoteStudents.push(doc.data());
            });
            if (remoteStudents.length > 0) {
              setStudents(remoteStudents);
            }
          }, (err) => console.log("Gagal membaca siswa dari cloud"));

          // Listener Firestore untuk Skor/Nilai Realtime dari Portal Siswa
          const scoresCol = collection(db, 'artifacts', appId, 'public', 'data', 'scores');
          const unsubScores = onSnapshot(scoresCol, (snapshot) => {
            const remoteScores = [];
            snapshot.docs.forEach(doc => remoteScores.push(doc.data()));
            if (remoteScores.length > 0) setScores(remoteScores);
          }, (err) => console.log("Offline mode active (scores)"));

          return () => {
            unsubMat();
            unsubQ();
            unsubPresence();
            unsubStudents();
            unsubScores();
          };
        } catch (err) {}
      }, []);

      // Synchronize current material's questions to Cloud when entering Manage Questions view
      const syncQuestionsToCloud = async (matId) => {
        const targetQuestions = questions.filter(q => q.materialId === matId);
        try {
          for (const q of targetQuestions) {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'questions', q.id);
            await setDoc(docRef, q);
          }
          // Simpan seluruh daftar soal ke data_questions
          const questionsRef = doc(db, 'artifacts', appId, 'public', 'data_questions');
          await setDoc(questionsRef, { list: questions });
        } catch (e) {
          console.log("Gagal sinkronisasi otomatis soal ke cloud");
        }
      };

      // BroadcastChannel Listener untuk update dari Tab Siswa
      useEffect(() => {
        if (!broadcast) return;
        const handleMessage = (event) => {
          const { type, payload } = event.data || {};
          if (type === 'STUDENT_PRESENCE_UPDATE') {
            setLiveMonitorData(prev => ({
              ...prev,
              [payload.id]: payload
            }));
          } else if (type === 'NEW_MATERIAL_PUBLISHED') {
            setMaterials(prev => [payload, ...prev.filter(m => m.id !== payload.id)]);
          } else if (type === 'NEW_QUESTION_ADDED') {
            setQuestions(prev => [...prev.filter(q => q.id !== payload.id), payload]);
          }
        };

        const handleStorageChange = () => {
          const mat = localStorage.getItem('elearning_materials_v3');
          if (mat) setMaterials(JSON.parse(mat));
          const qst = localStorage.getItem('elearning_questions_v3');
          if (qst) setQuestions(JSON.parse(qst));
          const sc = localStorage.getItem('elearning_scores_v3');
          if (sc) setScores(JSON.parse(sc));
          const lm = localStorage.getItem('elearning_live_monitor');
          if (lm) setLiveMonitorData(JSON.parse(lm));
        };

        broadcast.addEventListener('message', handleMessage);
        window.addEventListener('storage', handleStorageChange);
        return () => {
          broadcast.removeEventListener('message', handleMessage);
          window.removeEventListener('storage', handleStorageChange);
        };
      }, []);

      const showNotification = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(null), 4000);
      };

      // Handler Login Portal Guru
      const handleGuruLogin = (e) => {
        e.preventDefault();
        if (loginGuruPass !== 'guru123') {
          showNotification("Password Guru Salah! Gunakan: guru123");
          return;
        }

        const guruName = loginGuruName.trim() ? loginGuruName : 'Guru Pengajar IPS';
        setAppSession({ username: guruName });
        setActiveTab('dashboard');
        showNotification(`Selamat Datang, ${guruName}!`);
      };

      const handleLogout = () => {
        setAppSession(null);
        setActiveTab('dashboard');
        setSelectedMaterial(null);
      };

      // Terbitkan Materi Baru (Langsung Sinkron ke Portal Siswa)
      const handleCreateMaterial = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);

        const title = formData.get('title');
        const kelas = formData.get('kelas');
        const subKelasTarget = formData.get('subKelasTarget');
        const semester = formData.get('semester');
        const durationMinutes = parseInt(formData.get('durationMinutes')) || 15;
        const content = formData.get('content');
        const imageUrl = formData.get('imageUrl') || '';
        const source = formData.get('source') || '';

        if (!title || !content) {
          showNotification("Judul dan Teks Isi Materi Wajib Diisi!");
          return;
        }

        const newMat = {
          id: 'mat_' + Date.now(),
          title,
          kelas,
          subKelasTarget,
          semester,
          durationMinutes,
          content,
          imageUrl,
          source,
          createdBy: appSession.username,
          createdAt: Date.now()
        };

        setMaterials(prev => [newMat, ...prev]);

        // Broadcast Sync ke tab siswa lokal
        if (broadcast) {
          broadcast.postMessage({ type: 'NEW_MATERIAL_PUBLISHED', payload: newMat });
        }

        // Simpan ke Firestore agar Portal Siswa mendapatkan update instan
        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'materials', newMat.id);
          await setDoc(docRef, newMat);
          showNotification(`Materi "${title}" berhasil diterbitkan dan tersinkron ke Portal Siswa!`);
        } catch (err) {
          showNotification(`Materi tersimpan lokal (Offline).`);
        }

        e.target.reset();
        setActiveTab('dashboard');
      };

      const handleDeleteMaterial = async (id) => {
        if (!window.confirm("Apakah Anda yakin ingin menghapus materi ini beserta seluruh soalnya?")) return;
        setMaterials(prev => prev.filter(m => m.id !== id));

        const remainingQuestions = questions.filter(q => q.materialId !== id);
        setQuestions(remainingQuestions);

        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'materials', id);
          await deleteDoc(docRef);

          const questionsToDelete = questions.filter(q => q.materialId === id);
          for (const q of questionsToDelete) {
            const qRef = doc(db, 'artifacts', appId, 'public', 'data', 'questions', q.id);
            await deleteDoc(qRef);
          }

          // Sinkronisasi pembaruan list soal ke data_questions
          const listSoalBaru = remainingQuestions;
          const questionsRef = doc(db, 'artifacts', appId, 'public', 'data_questions');
          await setDoc(questionsRef, { list: listSoalBaru });
        } catch (e) {}

        showNotification("Materi beserta soal terkait telah dihapus.");
      };

      // Tambah Soal Latihan & Kuis (Sinkron Penuh ke Cloud & Portal Siswa)
      const handleAddQuestion = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const qType = formData.get('type');

        const newQ = {
          id: 'q_' + Date.now(),
          materialId: selectedMaterial.id,
          type: qType,
          questionText: formData.get('questionText'),
          createdAt: Date.now()
        };

        if (qType === 'pg') {
          newQ.optionA = formData.get('optionA');
          newQ.optionB = formData.get('optionB');
          newQ.optionC = formData.get('optionC');
          newQ.optionD = formData.get('optionD');
          newQ.correctAnswer = formData.get('correctAnswer');
        } else {
          newQ.correctAnswer = formData.get('correctAnswerIsian');
        }

        const listSoalBaru = [...questions, newQ];
        setQuestions(listSoalBaru);

        if (broadcast) {
          broadcast.postMessage({ type: 'NEW_QUESTION_ADDED', payload: newQ });
        }

        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'questions', newQ.id);
          await setDoc(docRef, newQ);

          // Simpan seluruh daftar soal terbaru ke dokumen data_questions
          const questionsRef = doc(db, 'artifacts', appId, 'public', 'data_questions');
          await setDoc(questionsRef, { list: listSoalBaru });

          showNotification("Soal berhasil ditambahkan & tersinkron ke Portal Siswa!");
        } catch (err) {
          showNotification("Soal tersimpan di penyimpanan lokal.");
        }

        e.target.reset();
      };

      const handleDeleteQuestion = async (qId) => {
        const listSoalBaru = questions.filter(q => q.id !== qId);
        setQuestions(listSoalBaru);

        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'questions', qId);
          await deleteDoc(docRef);

          // Update dokumen data_questions
          const questionsRef = doc(db, 'artifacts', appId, 'public', 'data_questions');
          await setDoc(questionsRef, { list: listSoalBaru });
        } catch (e) {}

        showNotification("Soal berhasil dihapus.");
      };

      // Upload Siswa Batch ke Cloud Database (Firestore)
      const handleUploadStudents = async (e) => {
        e.preventDefault();
        if (!rawStudentNames.trim()) {
          showNotification("Masukkan daftar nama siswa!");
          return;
        }

        const lines = rawStudentNames.split('\n').map(l => l.trim()).filter(l => l !== '');
        const newStus = lines.map((name, i) => ({
          id: `st_${Date.now()}_${i}`,
          name,
          kelas: studentInputKelas,
          subKelas: studentInputSubKelas
        }));

        setStudents(prev => [...prev, ...newStus]);
        setRawStudentNames('');

        // Simpan ke Cloud Database (Firestore)
        try {
          for (const student of newStus) {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'students', student.id);
            await setDoc(docRef, student);
          }
          showNotification(`Berhasil menyimpan ${newStus.length} siswa ke Database Cloud!`);
        } catch (err) {
          console.error("Gagal menyimpan ke cloud:", err);
          showNotification(`Siswa tersimpan di lokal, tetapi gagal sinkronisasi ke Cloud.`);
        }
      };

      const handleDeleteStudent = async (stId) => {
        setStudents(prev => prev.filter(s => s.id !== stId));
        
        // Hapus juga dari Firestore Cloud
        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'students', stId);
          await deleteDoc(docRef);
          showNotification("Nama siswa berhasil dihapus dari cloud database.");
        } catch (err) {
          showNotification("Nama siswa dihapus dari kelas.");
        }
      };

      // Mereset Status Siswa dari Kuning/Terganggu Kembali ke Aktif (Hijau)
      const handleResetStudentStatus = (presKey, studentName) => {
        if (liveMonitorData[presKey]) {
          const updated = {
            ...liveMonitorData[presKey],
            status: 'active',
            lastUpdated: Date.now()
          };

          setLiveMonitorData(prev => ({
            ...prev,
            [presKey]: updated
          }));

          if (broadcast) {
            broadcast.postMessage({
              type: 'TEACHER_RESET_STATUS',
              payload: { studentName, presKey }
            });
            broadcast.postMessage({
              type: 'STUDENT_PRESENCE_UPDATE',
              payload: updated
            });
          }

          try {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'student_presence', presKey);
            setDoc(docRef, updated).catch(() => {});
          } catch (e) {}

          showNotification(`Status pembelajaran ${studentName} di-reset menjadi Aktif (Hijau).`);
        }
      };

      // Menghentikan Kegiatan Belajar Siswa secara Paksa
      const handleStopStudentPresence = async (presKey, studentName) => {
        if (!window.confirm(`Hentikan sesi kegiatan belajar untuk ${studentName}?`)) return;

        if (liveMonitorData[presKey]) {
          const updated = {
            ...liveMonitorData[presKey],
            status: 'completed',
            remainingSeconds: 0,
            lastUpdated: Date.now()
          };

          setLiveMonitorData(prev => ({
            ...prev,
            [presKey]: updated
          }));

          if (broadcast) {
            broadcast.postMessage({
              type: 'TEACHER_STOP_STUDENT',
              payload: { studentName, presKey }
            });
            broadcast.postMessage({
              type: 'STUDENT_PRESENCE_UPDATE',
              payload: updated
            });
          }

          try {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'student_presence', presKey);
            await setDoc(docRef, updated);
          } catch (e) {}

          showNotification(`Kegiatan belajar ${studentName} telah dihentikan.`);
        }
      };

      // Menghapus Record Pantauan Realtime Siswa
      const handleDeleteStudentPresence = async (presKey, studentName) => {
        if (!window.confirm(`Hapus data pantauan realtime untuk ${studentName}?`)) return;

        setLiveMonitorData(prev => {
          const clone = { ...prev };
          delete clone[presKey];
          return clone;
        });

        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'student_presence', presKey);
          await deleteDoc(docRef);
        } catch (e) {}

        showNotification(`Data pantauan ${studentName} berhasil dihapus.`);
      };

      // Menghapus Seluruh Kegiatan Siswa pada Kelas Tertentu
      const handleDeleteClassPresence = async (kelasGroup) => {
        if (!window.confirm(`Hapus seluruh riwayat kegiatan untuk Kelas ${kelasGroup}?`)) return;

        const updatedData = { ...liveMonitorData };
        const keysToRemove = Object.keys(updatedData).filter(key => String(updatedData[key].kelas) === String(kelasGroup));

        for (const key of keysToRemove) {
          delete updatedData[key];
          try {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'student_presence', key);
            await deleteDoc(docRef);
          } catch (e) {}
        }

        setLiveMonitorData(updatedData);
        showNotification(`Seluruh data kegiatan Kelas ${kelasGroup} berhasil dihapus.`);
      };

      // Export Rekap Nilai ke Format Excel (.xlsx)
      const exportToExcel = (filteredScores) => {
        if (!filteredScores || filteredScores.length === 0) {
          showNotification("Tidak ada data nilai yang bisa di-download.");
          return;
        }

        if (typeof XLSX === 'undefined') {
          showNotification("Pustaka Excel gagal dimuat. Periksa koneksi internet Anda.");
          return;
        }

        const excelData = filteredScores.map((s, index) => ({
          'No': index + 1,
          'Nama Siswa': s.studentName || '-',
          'Kelas': s.kelas ? `Kelas ${s.kelas}` : '-',
          'Materi IPS': s.materialTitle || '-',
          'Nilai Akhir': s.score ?? 0,
          'Keterangan': (s.score ?? 0) >= 70 ? 'Lulus' : 'Remidial'
        }));

        const worksheet = XLSX.utils.json_to_sheet(excelData);
        
        worksheet['!cols'] = [
          { wch: 6 },
          { wch: 30 },
          { wch: 12 },
          { wch: 40 },
          { wch: 15 },
          { wch: 15 }
        ];

        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, 'Rekap Nilai');

        const fileName = `Rekap_Nilai_IPS_Kelas_${rekapFilterClass === 'semua' ? 'Semua' : rekapFilterClass}_${Date.now()}.xlsx`;
        XLSX.writeFile(workbook, fileName);
        showNotification("Berhasil mendownload Rekap Nilai Excel!");
      };

      if (!appSession) {
        return (
          <div className="min-h-screen bg-slate-950 flex flex-col justify-center items-center p-4 relative overflow-hidden">
            <div className="absolute -top-40 -left-40 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
            <div className="absolute -bottom-40 -right-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>

            <div className="w-full max-w-lg bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl relative z-10">
              <div className="text-center mb-8">
                <div className="inline-flex p-3.5 bg-gradient-to-tr from-blue-600 to-indigo-500 rounded-2xl shadow-lg shadow-blue-500/30 mb-3">
                  <Lock className="w-8 h-8 text-white" />
                </div>
                <h1 className="text-2xl font-extrabold text-white tracking-tight">Portal Guru - E-Learning IPS</h1>
                <p className="text-slate-400 text-xs mt-1">Dashboard Management & Live Student Activity Tracking</p>
              </div>

              {notification && (
                <div className="bg-red-500/20 border border-red-500/30 text-red-300 px-4 py-3 rounded-xl text-xs text-center mb-6">
                  {notification}
                </div>
              )}

              <form onSubmit={handleGuruLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-400 mb-1.5">Nama Pengajar / NIP</label>
                  <input 
                    type="text"
                    placeholder="Masukkan Nama/NIP Guru (Contoh: Dra. Hj. Siti Rahmah)"
                    value={loginGuruName}
                    onChange={(e) => setLoginGuruName(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-200 text-xs focus:border-blue-500 outline-none"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-400 mb-1.5">Password Otentikasi Guru</label>
                  <input 
                    type="password"
                    placeholder="Password Default: guru123"
                    value={loginGuruPass}
                    onChange={(e) => setLoginGuruPass(e.target.value)}
                    required
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-slate-200 text-xs focus:border-blue-500 outline-none"
                  />
                </div>

                <button type="submit" className="w-full mt-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-blue-600/30 flex justify-center items-center gap-2 text-xs active:scale-95">
                  <LogIn className="w-4 h-4"/> Masuk Dashboard Guru
                </button>
              </form>
            </div>
          </div>
        );
      }

      const renderTeacherContent = () => {

        // TAB: Pantauan Realtime Siswa
        if (activeTab === 'monitor') {
          const presenceList = Object.values(liveMonitorData).sort((a, b) => b.lastUpdated - a.lastUpdated);

          // Grouping Presensi Berdasarkan Kelas
          const groupedPresence = presenceList.reduce((acc, curr) => {
            const k = curr.kelas || 'Lainnya';
            if (!acc[k]) acc[k] = [];
            acc[k].push(curr);
            return acc;
          }, {});

          return (
            <div className="space-y-6 max-w-6xl mx-auto">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-xl flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                  <h2 className="text-lg sm:text-xl font-extrabold text-white flex items-center gap-2">
                    <Radio className="w-5 h-5 text-emerald-400 animate-pulse" /> Pantauan Realtime Siswa (Live Student Monitor)
                  </h2>
                  <p className="text-slate-400 text-xs mt-1">
                    Memonitor secara langsung siswa yang sedang membaca materi. Timer berjalan sesuai durasi materi spesifik yang sedang dipelajari.
                  </p>
                </div>
                <button onClick={() => setActiveTab('dashboard')} className="text-slate-400 hover:text-white flex items-center gap-1 text-xs font-semibold bg-slate-950 border border-slate-800 px-3 py-2 rounded-xl self-start md:self-auto">
                  <ArrowLeft className="w-4 h-4"/> Kembali
                </button>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div className="bg-slate-900/80 border border-slate-800 p-3.5 rounded-2xl flex items-center gap-3">
                  <div className="w-3.5 h-3.5 rounded-full bg-emerald-500 shadow-lg shadow-emerald-500/50 animate-pulse shrink-0"></div>
                  <div>
                    <div className="text-xs font-bold text-emerald-400">Aktif / Sedang Belajar</div>
                    <div className="text-[10px] text-slate-400">Timer berjalan sesuai durasi materi</div>
                  </div>
                </div>

                <div className="bg-slate-900/80 border border-slate-800 p-3.5 rounded-2xl flex items-center gap-3">
                  <div className="w-3.5 h-3.5 rounded-full bg-yellow-400 shadow-lg shadow-yellow-400/50 animate-bounce shrink-0"></div>
                  <div>
                    <div className="text-xs font-bold text-yellow-400">Pindah Tab / Tidak Fokus</div>
                    <div className="text-[10px] text-slate-400">Siswa membuka tab lain/minimize browser</div>
                  </div>
                </div>

                <div className="bg-slate-900/80 border border-slate-800 p-3.5 rounded-2xl flex items-center gap-3">
                  <div className="w-3.5 h-3.5 rounded-full bg-blue-500 shadow-lg shadow-blue-500/50 shrink-0"></div>
                  <div>
                    <div className="text-xs font-bold text-blue-400">Selesai Membaca / Kuis</div>
                    <div className="text-[10px] text-slate-400">Siswa telah menyelesaikan durasi/kuis</div>
                  </div>
                </div>
              </div>

              {Object.keys(groupedPresence).length === 0 ? (
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-12 text-center text-slate-500 italic">
                  Belum ada siswa yang sedang aktif membaca materi secara realtime.
                </div>
              ) : (
                Object.keys(groupedPresence).map(kelasGroup => {
                  const classItems = groupedPresence[kelasGroup];
                  const hasActiveInClass = classItems.some(item => item.status === 'active' || item.status === 'warning');

                  return (
                    <div key={kelasGroup} className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl space-y-2">
                      <div className="p-4 bg-slate-950 border-b border-slate-800 flex justify-between items-center text-xs">
                        <span className="font-bold text-white text-sm flex items-center gap-2">
                          <span className="bg-blue-600/20 text-blue-400 px-2.5 py-1 rounded-lg border border-blue-500/30">
                            Kelas {kelasGroup}
                          </span>
                          <span>({classItems.length} Siswa Terdeteksi)</span>
                        </span>

                        {!hasActiveInClass && (
                          <button
                            onClick={() => handleDeleteClassPresence(kelasGroup)}
                            className="px-3 py-1.5 bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-500/30 rounded-xl font-bold transition-all flex items-center gap-1 text-xs"
                          >
                            <Trash2 className="w-3.5 h-3.5" /> Hapus Kelas
                          </button>
                        )}
                      </div>

                      <div className="hidden md:block overflow-x-auto">
                        <table className="w-full text-left text-xs">
                          <thead>
                            <tr className="bg-slate-950/50 text-slate-400 uppercase tracking-wider border-b border-slate-800">
                              <th className="p-4">Nama Siswa</th>
                              <th className="p-4">Kelas & Rombel</th>
                              <th className="p-4">Materi yang Dibuka</th>
                              <th className="p-4">Sisa Waktu Timer</th>
                              <th className="p-4">Status Kehadiran</th>
                              <th className="p-4 text-center">Aksi Guru</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-800 text-slate-300">
                            {classItems.map((p) => {
                              const isWarning = p.status === 'warning';
                              const isActive = p.status === 'active';
                              const isCompleted = p.status === 'completed';

                              // Cari durasi spesifik berdasarkan materi siswa
                              const matchedMat = materials.find(m => m.id === p.materialId || m.title === p.materialTitle);
                              const matDurationSecs = matchedMat ? (matchedMat.durationMinutes * 60) : (p.totalDurationSeconds || 900);
                              
                              // Sisa waktu diambil langsung dari p.remainingSeconds sesuai materi
                              const remSecs = (p.remainingSeconds !== undefined && p.remainingSeconds !== null) 
                                ? p.remainingSeconds 
                                : matDurationSecs;

                              const mins = Math.floor(Math.max(0, remSecs) / 60);
                              const secs = Math.max(0, remSecs) % 60;
                              const timeStr = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

                              return (
                                <tr key={p.id} className={`transition-colors ${isWarning ? 'bg-yellow-500/10' : 'hover:bg-slate-800/40'}`}>
                                  <td className="p-4 font-bold text-white">{p.studentName}</td>
                                  <td className="p-4">
                                    <span className="bg-slate-800 text-slate-200 px-2.5 py-1 rounded-lg border border-slate-700 font-semibold">
                                      Kelas {p.kelas}
                                    </span>
                                  </td>
                                  <td className="p-4 max-w-xs truncate font-medium text-slate-200">
                                    {p.materialTitle}
                                    {matchedMat && (
                                      <span className="block text-[10px] text-slate-400 font-normal">
                                        Durasi Total: {matchedMat.durationMinutes} Menit
                                      </span>
                                    )}
                                  </td>
                                  <td className="p-4 font-mono font-bold text-amber-300">
                                    <Clock className="w-3.5 h-3.5 inline mr-1 text-amber-400" />
                                    {timeStr}
                                  </td>
                                  <td className="p-4">
                                    {isActive && (
                                      <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-extrabold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                                        <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                                        Sedang Belajar (Fokus)
                                      </span>
                                    )}
                                    {isWarning && (
                                      <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-extrabold bg-yellow-500/20 text-yellow-300 border border-yellow-500/40">
                                        <AlertTriangle className="w-3.5 h-3.5 text-yellow-400 animate-bounce" />
                                        Pindah Tab / Tidak Fokus
                                      </span>
                                    )}
                                    {isCompleted && (
                                      <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold bg-blue-500/20 text-blue-400 border border-blue-500/30">
                                        Selesai Membaca
                                      </span>
                                    )}
                                  </td>
                                  <td className="p-4">
                                    <div className="flex items-center justify-center gap-1.5">
                                      {isWarning && (
                                        <button
                                          onClick={() => handleResetStudentStatus(p.id, p.studentName)}
                                          className="px-2.5 py-1.5 bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-bold text-[11px] rounded-lg shadow-md transition-all flex items-center gap-1"
                                          title="Reset / Izinkan Lanjut"
                                        >
                                          <RefreshCw className="w-3 h-3" /> Reset
                                        </button>
                                      )}

                                      {!isCompleted && (
                                        <button
                                          onClick={() => handleStopStudentPresence(p.id, p.studentName)}
                                          className="px-2.5 py-1.5 bg-amber-600/20 hover:bg-amber-600/30 text-amber-400 border border-amber-500/30 font-bold text-[11px] rounded-lg transition-all flex items-center gap-1"
                                          title="Hentikan Kegiatan Belajar"
                                        >
                                          <StopCircle className="w-3 h-3" /> Hentikan
                                        </button>
                                      )}

                                      <button
                                        onClick={() => handleDeleteStudentPresence(p.id, p.studentName)}
                                        className="px-2.5 py-1.5 bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-500/30 font-bold text-[11px] rounded-lg transition-all flex items-center gap-1"
                                        title="Hapus Record Pantauan"
                                      >
                                        <Trash2 className="w-3 h-3" /> Hapus
                                      </button>
                                    </div>
                                  </td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          );
        }

        // TAB: Form Terbitkan Materi Baru
        if (activeTab === 'tambah_materi') {
          return (
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 max-w-4xl mx-auto shadow-xl">
              <div className="flex justify-between items-center mb-6 pb-4 border-b border-slate-800">
                <h2 className="text-lg sm:text-xl font-bold text-white flex items-center gap-2">
                  <PlusCircle className="text-blue-500 shrink-0"/> Terbitkan Materi Pembelajaran Baru
                </h2>
                <button onClick={() => setActiveTab('dashboard')} className="text-slate-400 hover:text-white flex items-center gap-1 text-xs font-semibold">
                  <ArrowLeft className="w-4 h-4"/> Kembali
                </button>
              </div>

              <form onSubmit={handleCreateMaterial} className="space-y-5">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="md:col-span-2">
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Judul Materi IPS</label>
                    <input type="text" name="title" required className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:border-blue-500 outline-none" placeholder="Contoh: Keberagaman Etnis & Budaya Indonesia" />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Durasi Timer Belajar (Menit)</label>
                    <input type="number" min="1" max="180" name="durationMinutes" defaultValue="15" required className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:border-blue-500 outline-none" />
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Tingkat Kelas</label>
                    <select name="kelas" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white">
                      <option value="7">Kelas 7</option>
                      <option value="8">Kelas 8</option>
                      <option value="9">Kelas 9</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Target Rombel/Sub-Kelas</label>
                    <select name="subKelasTarget" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white">
                      <option value="semua">Semua Rombel (A, B, C, D)</option>
                      <option value="A">Khusus Rombel A</option>
                      <option value="B">Khusus Rombel B</option>
                      <option value="C">Khusus Rombel C</option>
                      <option value="D">Khusus Rombel D</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Semester</label>
                    <select name="semester" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white">
                      <option value="1">Semester 1 (Ganjil)</option>
                      <option value="2">Semester 2 (Genap)</option>
                    </select>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">URL Gambar Ilustrasi (Opsional)</label>
                    <input type="url" name="imageUrl" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:border-blue-500 outline-none" placeholder="https://..." />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Sumber Referensi Materi</label>
                    <input type="text" name="source" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:border-blue-500 outline-none" placeholder="Buku Paket IPS Kemendikbudristek Hal. 85" />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-400 mb-1">Teks Isi Materi Pembelajaran</label>
                  <textarea name="content" required rows="12" className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:border-blue-500 outline-none leading-relaxed font-sans" placeholder="Tuliskan rangkuman dan uraian materi IPS secara mendalam di sini..."></textarea>
                </div>

                <button type="submit" className="w-full md:w-auto bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-8 rounded-xl transition-all shadow-lg shadow-blue-600/30 text-xs active:scale-95">
                  Terbitkan Materi Pembelajaran
                </button>
              </form>
            </div>
          );
        }

        // TAB: Kelola Soal Latihan & Kuis (Tersinkronisasi dengan Portal Siswa)
        if (activeTab === 'kelola_soal' && selectedMaterial) {
          const matQuestions = questions.filter(q => q.materialId === selectedMaterial.id);
          return (
            <div className="space-y-6 max-w-4xl mx-auto">
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-xl">
                <div className="flex justify-between items-center mb-6 pb-4 border-b border-slate-800">
                  <div>
                    <h2 className="text-lg sm:text-xl font-bold text-white flex items-center gap-2"><List className="text-blue-500 shrink-0"/> Kelola Soal Latihan & Evaluasi</h2>
                    <p className="text-slate-400 text-xs mt-1">Materi: <span className="text-white font-semibold">{selectedMaterial.title}</span> (Kelas {selectedMaterial.kelas})</p>
                  </div>
                  <button onClick={() => {setActiveTab('dashboard'); setSelectedMaterial(null);}} className="text-slate-400 hover:text-white flex items-center gap-1 text-xs font-semibold">
                    <ArrowLeft className="w-4 h-4"/> Kembali
                  </button>
                </div>

                <form onSubmit={handleAddQuestion} className="space-y-4 bg-slate-950 p-4 sm:p-5 rounded-xl border border-slate-800">
                  <h3 className="font-semibold text-white text-xs">Buat Pertanyaan Baru (Tersinkron Langsung ke Portal Siswa)</h3>
                  
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div className="md:col-span-2">
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Pertanyaan / Soal</label>
                      <input type="text" name="questionText" required className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:border-blue-500 outline-none" placeholder="Tuliskan pertanyaan soal..." />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Tipe Soal</label>
                      <select id="questionTypeSelect" name="type" className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white" onChange={(e) => {
                        const pgContainer = document.getElementById('pgOptionsContainer');
                        const isianContainer = document.getElementById('isianAnswerContainer');
                        if (e.target.value === 'pg') {
                          pgContainer.style.display = 'block';
                          isianContainer.style.display = 'none';
                        } else {
                          pgContainer.style.display = 'none';
                          isianContainer.style.display = 'block';
                        }
                      }}>
                        <option value="pg">Pilihan Ganda (A, B, C, D)</option>
                        <option value="isian">Isian Singkat</option>
                      </select>
                    </div>
                  </div>

                  <div id="pgOptionsContainer" className="space-y-3">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                      <div><label className="block text-[11px] text-slate-400 mb-1">Opsi A</label><input type="text" name="optionA" className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-white" /></div>
                      <div><label className="block text-[11px] text-slate-400 mb-1">Opsi B</label><input type="text" name="optionB" className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-white" /></div>
                      <div><label className="block text-[11px] text-slate-400 mb-1">Opsi C</label><input type="text" name="optionC" className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-white" /></div>
                      <div><label className="block text-[11px] text-slate-400 mb-1">Opsi D</label><input type="text" name="optionD" className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-white" /></div>
                    </div>
                    <div>
                      <label className="block text-[11px] text-slate-400 mb-1">Kunci Jawaban Pilihan Ganda</label>
                      <select name="correctAnswer" className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-white">
                        <option value="A">Opsi A</option>
                        <option value="B">Opsi B</option>
                        <option value="C">Opsi C</option>
                        <option value="D">Opsi D</option>
                      </select>
                    </div>
                  </div>

                  <div id="isianAnswerContainer" className="hidden">
                    <label className="block text-[11px] text-slate-400 mb-1">Kunci Jawaban / Kata Kunci Isian</label>
                    <input type="text" name="correctAnswerIsian" placeholder="Jawaban singkat yang benar..." className="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-white" />
                  </div>

                  <button type="submit" className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-6 rounded-xl text-xs transition-all shadow-md active:scale-95">
                    + Simpan & Terbitkan Soal
                  </button>
                </form>
              </div>

              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-xl">
                <h3 className="font-bold text-white text-sm mb-4">Daftar Soal Tersimpan ({matQuestions.length})</h3>
                <div className="space-y-3">
                  {matQuestions.map((q, idx) => (
                    <div key={q.id} className="p-4 rounded-xl bg-slate-950 border border-slate-800 relative">
                      <button onClick={() => handleDeleteQuestion(q.id)} className="absolute top-4 right-4 text-slate-500 hover:text-red-400 transition-colors" title="Hapus Soal">
