                        <Trash2 className="w-4 h-4" />
                      </button>
                      <p className="font-semibold text-slate-200 text-xs mb-2 pr-8">{idx + 1}. {q.questionText} <span className="text-[10px] text-blue-400 font-normal">({q.type === 'pg' ? 'Pilihan Ganda' : 'Isian'})</span></p>
                      
                      {q.type === 'pg' ? (
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-[11px] text-slate-400">
                          <div className={q.correctAnswer === 'A' ? 'text-emerald-400 font-bold' : ''}>A. {q.optionA}</div>
                          <div className={q.correctAnswer === 'B' ? 'text-emerald-400 font-bold' : ''}>B. {q.optionB}</div>
                          <div className={q.correctAnswer === 'C' ? 'text-emerald-400 font-bold' : ''}>C. {q.optionC}</div>
                          <div className={q.correctAnswer === 'D' ? 'text-emerald-400 font-bold' : ''}>D. {q.optionD}</div>
                        </div>
                      ) : (
                        <p className="text-[11px] text-emerald-400">Kunci Jawaban: {q.correctAnswer}</p>
                      )}
                    </div>
                  ))}
                  {matQuestions.length === 0 && <p className="text-slate-500 text-xs italic">Belum ada soal latihan untuk materi ini.</p>}
                </div>
              </div>
            </div>
          );
        }

        // TAB: Upload & Kelola Data Siswa Cloud Database
        if (activeTab === 'upload_siswa') {
          const currentFilteredStudents = students.filter(s => s.kelas === manageStudentClass && s.subKelas === manageStudentSubClass);
          
          return (
            <div className="space-y-6 max-w-5xl mx-auto">
              <div className="flex justify-between items-center">
                <h2 className="text-lg sm:text-xl font-bold text-white flex items-center gap-2"><UserPlus className="text-blue-500 shrink-0"/> Kelola Siswa Cloud (Portal Siswa Ready)</h2>
                <button onClick={() => setActiveTab('dashboard')} className="text-slate-400 hover:text-white flex items-center gap-1 text-xs font-semibold">
                  <ArrowLeft className="w-4 h-4"/> Kembali
                </button>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-xl">
                  <h3 className="font-bold text-white text-xs mb-4 flex items-center gap-2"><Upload className="w-4 h-4 text-blue-500" /> Batch Upload ke Cloud Database</h3>
                  <form onSubmit={handleUploadStudents} className="space-y-4">
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-semibold text-slate-400 mb-1">Pilih Kelas</label>
                        <select value={studentInputKelas} onChange={(e) => setStudentInputKelas(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white">
                          <option value="7">Kelas 7</option>
                          <option value="8">Kelas 8</option>
                          <option value="9">Kelas 9</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-slate-400 mb-1">Pilih Rombel</label>
                        <select value={studentInputSubKelas} onChange={(e) => setStudentInputSubKelas(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white">
                          <option value="A">Rombel A</option>
                          <option value="B">Rombel B</option>
                          <option value="C">Rombel C</option>
                          <option value="D">Rombel D</option>
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Daftar Nama Siswa (Copy-Paste 1 Nama Per Baris)</label>
                      <textarea 
                        rows="8" 
                        value={rawStudentNames}
                        onChange={(e) => setRawStudentNames(e.target.value)}
                        placeholder="Contoh:&#10;Ahmad Rizky Pratama&#10;Anisa Rahmawati&#10;Budi Santoso"
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:border-blue-500 leading-relaxed"
                      ></textarea>
                    </div>

                    <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl text-xs transition-all shadow-md active:scale-95">
                      Simpan Ke Cloud Database (Kelas {studentInputKelas}{studentInputSubKelas})
                    </button>
                  </form>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 sm:p-6 shadow-xl flex flex-col">
                  <div className="flex justify-between items-center mb-4">
                    <h3 className="font-bold text-white text-xs">Daftar Siswa (Tersinkronisasi Cloud)</h3>
                    <div className="flex gap-2">
                      <select value={manageStudentClass} onChange={(e) => setManageStudentClass(e.target.value)} className="bg-slate-950 border border-slate-800 rounded-lg p-1.5 text-xs text-white">
                        <option value="7">Kelas 7</option>
                        <option value="8">Kelas 8</option>
                        <option value="9">Kelas 9</option>
                      </select>
                      <select value={manageStudentSubClass} onChange={(e) => setManageStudentSubClass(e.target.value)} className="bg-slate-950 border border-slate-800 rounded-lg p-1.5 text-xs text-white">
                        <option value="A">Rombel A</option>
                        <option value="B">Rombel B</option>
                        <option value="C">Rombel C</option>
                        <option value="D">Rombel D</option>
                      </select>
                    </div>
                  </div>

                  <div className="flex-1 overflow-y-auto max-h-[350px] space-y-2 pr-1">
                    {currentFilteredStudents.map((st, i) => (
                      <div key={st.id} className="flex justify-between items-center p-2.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-300">
                        <span>{i + 1}. {st.name}</span>
                        <button onClick={() => handleDeleteStudent(st.id)} className="text-slate-500 hover:text-red-400 p-1" title="Hapus Siswa">
                          <Trash2 className="w-3.5 h-3.5" />
                        </button>
                      </div>
                    ))}
                    {currentFilteredStudents.length === 0 && (
                      <p className="text-center text-slate-500 text-xs py-12 italic">Belum ada nama siswa di Cloud untuk Kelas {manageStudentClass}{manageStudentSubClass}.</p>
                    )}
                  </div>
                </div>
              </div>
            </div>
          );
        }

        // TAB: Rekap Nilai Kuis
        if (activeTab === 'rekap_nilai') {
          const filteredScores = scores.filter(s => {
            const matchClass = rekapFilterClass === 'semua' || s.kelas === rekapFilterClass;
            const matchSubClass = rekapFilterSubClass === 'semua' || s.subKelas === rekapFilterSubClass;
            return matchClass && matchSubClass;
          });

          return (
            <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden max-w-5xl mx-auto shadow-xl">
              <div className="p-4 sm:p-6 border-b border-slate-800 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                  <h2 className="text-lg sm:text-xl font-bold text-white flex items-center gap-2"><Award className="text-yellow-500 shrink-0"/> Rekap Nilai Evaluasi Siswa</h2>
                  <p className="text-slate-400 text-xs mt-1">Unduh rekap nilai per kelas dalam bentuk format Microsoft Excel (.xlsx)</p>
                </div>
                
                <div className="flex flex-wrap items-center gap-2">
                  <button 
                    onClick={() => exportToExcel(filteredScores)} 
                    className="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2.5 rounded-xl font-bold text-xs shadow-lg shadow-emerald-600/30 transition-all flex items-center justify-center gap-2 active:scale-95"
                  >
                    <Download className="w-4 h-4"/> Download Rekap Nilai (.xlsx)
                  </button>
                  <button onClick={() => setActiveTab('dashboard')} className="hidden sm:flex text-slate-400 hover:text-white items-center gap-1 text-xs font-semibold bg-slate-950 px-3 py-2 rounded-xl border border-slate-800">
                    <ArrowLeft className="w-4 h-4"/> Kembali
                  </button>
                </div>
              </div>

              <div className="p-4 bg-slate-950/70 border-b border-slate-800 flex flex-wrap items-center justify-between gap-3 text-xs">
                <div className="flex flex-wrap items-center gap-2">
                  <span className="text-slate-400 font-semibold flex items-center gap-1">
                    <Filter className="w-3.5 h-3.5 text-blue-400" /> Filter Kelas:
                  </span>
                  <select 
                    value={rekapFilterClass} 
                    onChange={(e) => setRekapFilterClass(e.target.value)}
                    className="bg-slate-900 border border-slate-800 rounded-lg px-2.5 py-1.5 text-white outline-none focus:border-blue-500"
                  >
                    <option value="semua">Semua Tingkat Kelas</option>
                    <option value="7">Kelas 7</option>
                    <option value="8">Kelas 8</option>
                    <option value="9">Kelas 9</option>
                  </select>

                  <select 
                    value={rekapFilterSubClass} 
                    onChange={(e) => setRekapFilterSubClass(e.target.value)}
                    className="bg-slate-900 border border-slate-800 rounded-lg px-2.5 py-1.5 text-white outline-none focus:border-blue-500"
                  >
                    <option value="semua">Semua Rombel</option>
                    <option value="A">Rombel A</option>
                    <option value="B">Rombel B</option>
                    <option value="C">Rombel C</option>
                    <option value="D">Rombel D</option>
                  </select>
                </div>

                <div className="text-slate-400 text-[11px]">
                  Menampilkan <span className="text-white font-bold">{filteredScores.length}</span> Data Nilai
                </div>
              </div>

              <div className="hidden md:block overflow-x-auto">
                <table className="w-full text-left text-xs">
                  <thead>
                    <tr className="bg-slate-950 text-slate-400 uppercase tracking-wider border-b border-slate-800">
                      <th className="p-4">No</th>
                      <th className="p-4">Nama Siswa</th>
                      <th className="p-4">Kelas & Rombel</th>
                      <th className="p-4">Materi IPS</th>
                      <th className="p-4 text-center">Nilai Akhir</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800 text-slate-300">
                    {filteredScores.map((s, idx) => (
                      <tr key={s.id || idx} className="hover:bg-slate-800/50">
                        <td className="p-4 text-slate-500 font-mono">{idx + 1}</td>
                        <td className="p-4 font-bold text-white">{s.studentName}</td>
                        <td className="p-4">
                          <span className="bg-slate-800 px-2 py-0.5 rounded text-[11px]">Kelas {s.kelas}</span>
                        </td>
                        <td className="p-4">{s.materialTitle}</td>
                        <td className="p-4 text-center">
                          <span className={`inline-block px-3 py-1 rounded-full font-bold ${s.score >= 70 ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-red-500/20 text-red-400 border border-red-500/30'}`}>
                            {s.score} / 100
                          </span>
                        </td>
                      </tr>
                    ))}
                    {filteredScores.length === 0 && (
                      <tr><td colSpan="5" className="p-8 text-center text-slate-500 italic">Belum ada data nilai kuis untuk filter kelas ini.</td></tr>
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          );
        }

        // DASHBOARD UTAMA GURU
        const filteredMaterials = filterClassGuru === 'semua' 
          ? materials 
          : materials.filter(m => m.kelas === filterClassGuru);

        return (
          <div className="space-y-6">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-xl">
              <div className="flex flex-wrap items-center gap-2">
                <button onClick={() => setActiveTab('tambah_materi')} className="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white px-3.5 py-2.5 rounded-xl font-bold text-xs shadow-lg shadow-blue-600/30 transition-all active:scale-95">
                  <PlusCircle className="w-4 h-4"/> Terbitkan Materi
                </button>
                <button onClick={() => setActiveTab('monitor')} className="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white px-3.5 py-2.5 rounded-xl font-bold text-xs shadow-lg shadow-emerald-600/30 transition-all active:scale-95">
                  <Radio className="w-4 h-4 animate-pulse"/> Pantauan Realtime
                </button>
                <button onClick={() => setActiveTab('upload_siswa')} className="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-200 px-3.5 py-2.5 rounded-xl font-semibold text-xs transition-all active:scale-95">
                  <UserPlus className="w-4 h-4 text-blue-400"/> Kelola Siswa Cloud
                </button>
                <button onClick={() => setActiveTab('rekap_nilai')} className="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-200 px-3.5 py-2.5 rounded-xl font-semibold text-xs transition-all active:scale-95">
                  <Award className="w-4 h-4 text-yellow-500"/> Rekap Nilai (.xlsx)
                </button>
              </div>

              <div className="flex items-center gap-1 text-xs font-semibold bg-slate-950 p-1 rounded-xl border border-slate-800 overflow-x-auto">
                <span className="px-2 text-slate-500 shrink-0">Filter:</span>
                {['semua', '7', '8', '9'].map(k => (
                  <button 
                    key={k}
                    onClick={() => setFilterClassGuru(k)}
                    className={`px-3 py-1.5 rounded-lg capitalize whitespace-nowrap transition-all ${filterClassGuru === k ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-400 hover:text-white'}`}
                  >
                    {k === 'semua' ? 'Semua Kelas' : `Kelas ${k}`}
                  </button>
                ))}
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              {filteredMaterials.map(m => {
                const qCount = questions.filter(q => q.materialId === m.id).length;
                return (
                  <div key={m.id} className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden flex flex-col hover:border-slate-700 transition-all shadow-xl">
                    {m.imageUrl && (
                      <div className="h-40 bg-slate-950 overflow-hidden">
                        <img src={m.imageUrl} alt={m.title} className="w-full h-full object-cover" />
                      </div>
                    )}
                    <div className="p-5 flex-1 flex flex-col">
                      <div className="flex justify-between items-start mb-2">
                        <span className="bg-blue-500/10 text-blue-400 text-[11px] font-bold px-2.5 py-1 rounded-lg border border-blue-500/20">
                          Kelas {m.kelas} • Smt {m.semester}
                        </span>
                        <button onClick={() => handleDeleteMaterial(m.id)} className="text-slate-500 hover:text-red-400 transition-colors p-1" title="Hapus Materi">
                          <Trash2 className="w-4 h-4" />
                        </button>
                      </div>
                      
                      <h3 className="font-bold text-white text-sm mb-1 leading-snug">{m.title}</h3>
                      <div className="flex items-center gap-2 text-[11px] text-amber-400 font-semibold mb-3">
                        <Clock className="w-3.5 h-3.5" /> Timer Belajar: {m.durationMinutes} Menit
                      </div>
                      <p className="text-xs text-slate-400 line-clamp-3 mb-4 leading-relaxed">{m.content}</p>

                      <div className="pt-4 border-t border-slate-800 mt-auto flex items-center justify-between">
                        <span className="text-xs text-slate-400 font-medium">{qCount} Soal/Kuis</span>
                        <button 
                          onClick={() => { 
                            setSelectedMaterial(m); 
                            setActiveTab('kelola_soal');
                            syncQuestionsToCloud(m.id);
                          }}
                          className="px-3 py-1.5 bg-blue-600/10 hover:bg-blue-600/20 text-blue-400 border border-blue-500/30 rounded-xl transition-all text-xs font-semibold flex items-center gap-1 active:scale-95"
                        >
                          <List className="w-3.5 h-3.5"/> Kelola Soal
                        </button>
                      </div>
                    </div>
                  </div>
                );
              })}

              {filteredMaterials.length === 0 && (
                <div className="col-span-full p-12 text-center text-slate-500 border border-dashed border-slate-800 rounded-2xl">
                  <BookOpen className="w-10 h-10 mx-auto mb-2 text-slate-600"/>
                  <p className="font-semibold text-xs">Belum ada materi pembelajaran terbit untuk kelas ini.</p>
                </div>
              )}
            </div>
          </div>
        );
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100">
          {notification && (
            <div className="fixed top-4 right-4 z-50 bg-blue-600 text-white px-5 py-3 rounded-2xl shadow-xl font-bold text-xs animate-bounce border border-blue-400/30">
              {notification}
            </div>
          )}

          <nav className="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex justify-between h-16 items-center">
                <div className="flex items-center gap-3 cursor-pointer" onClick={() => {setActiveTab('dashboard'); setSelectedMaterial(null);}}>
                  <div className="bg-blue-600 p-2 rounded-xl text-white shadow-lg shadow-blue-600/30">
                    <Lock className="w-5 h-5" />
                  </div>
                  <div>
                    <span className="text-base font-extrabold text-white block leading-none">Dashboard Guru IPS</span>
                    <span className="text-[10px] text-slate-400">SMP/MTs Portal Pengajar</span>
                  </div>
                </div>

                <div className="flex items-center gap-4">
                  <div className="text-right hidden sm:block">
                    <div className="text-xs font-bold text-white">{appSession.username}</div>
                    <div className="text-[10px] text-slate-400">Guru Pengajar IPS</div>
                  </div>
                  <button onClick={handleLogout} className="flex items-center gap-1.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 px-3 py-1.5 rounded-xl text-xs font-semibold transition-all">
                    <LogOut className="w-3.5 h-3.5" /> <span className="hidden sm:inline">Keluar</span>
                  </button>
                </div>
              </div>
            </div>
          </nav>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 md:py-8">
            {renderTeacherContent()}
          </main>

          <div className="md:hidden fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-lg border-t border-slate-800 z-50 px-3 py-2 flex justify-around items-center">
            <button 
              onClick={() => { setActiveTab('dashboard'); setSelectedMaterial(null); }}
              className={`flex flex-col items-center gap-1 px-3 py-1 rounded-xl text-[10px] font-semibold transition-all ${activeTab === 'dashboard' ? 'text-blue-400' : 'text-slate-400'}`}
            >
              <LayoutDashboard className="w-5 h-5"/>
              Materi
            </button>
            <button 
              onClick={() => setActiveTab('monitor')}
              className={`flex flex-col items-center gap-1 px-3 py-1 rounded-xl text-[10px] font-semibold transition-all ${activeTab === 'monitor' ? 'text-emerald-400' : 'text-slate-400'}`}
            >
              <Radio className="w-5 h-5"/>
              Monitor
            </button>
            <button 
              onClick={() => setActiveTab('upload_siswa')}
              className={`flex flex-col items-center gap-1 px-3 py-1 rounded-xl text-[10px] font-semibold transition-all ${activeTab === 'upload_siswa' ? 'text-blue-400' : 'text-slate-400'}`}
            >
              <UserPlus className="w-5 h-5"/>
              Siswa
            </button>
            <button 
              onClick={() => setActiveTab('rekap_nilai')}
              className={`flex flex-col items-center gap-1 px-3 py-1 rounded-xl text-[10px] font-semibold transition-all ${activeTab === 'rekap_nilai' ? 'text-yellow-400' : 'text-slate-400'}`}
            >
              <Award className="w-5 h-5"/>
              Nilai
            </button>
          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<AppWrapper />);
  </script>
</body>
</html>
